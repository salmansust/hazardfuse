# conda env create -f environment.yml && conda activate hazardfuse
name: hazardfuse
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - rasterio=1.3.11          # GDAL from conda-forge (avoids system GDAL issues, e.g. on Windows)
  - pip:
      - -r requirements.txt
      - -e .
